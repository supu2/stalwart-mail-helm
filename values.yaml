global:
  imageRegistry: ""
  ## E.g.
  ## imagePullSecrets:
  ##   - myRegistryKeySecretName
  ##
  imagePullSecrets: []
  defaultStorageClass: ""
  storageClass: ""

replicaCount: 1

image:
  repository: ghcr.io/stalwartlabs/stalwart
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Maps to STALWART_ROLE. Names a ClusterRole defined in the database.
# Leave empty on single-node installs to run every task and listener.
# See /docs/cluster/configuration/roles for the role model.
role: ""

# Maps to STALWART_PUSH_SHARD. Only set on nodes whose role delivers
# push notifications. Leave empty on single-node installs.
pushShard: ""

# Recovery / bootstrap administrator credential.
# Enable this on first install so the operator can sign in without
# scraping the pod logs for the generated temporary password.
# Remove it once a permanent administrator account has been
# provisioned through the setup wizard.
recoveryAdmin:
  enabled: true
  username: admin
  password: "change-me"

# Starts the pods in recovery mode. Suspends mail services and
# exposes only the management listener on the configured port.
# See /docs/configuration/recovery-mode.
recoveryMode:
  enabled: false
  port: 8080
  logLevel: info

# Extra environment variables injected into the container, for
# store credentials that live in plain text.
extraEnv: []

# Extra environment variables injected from the managed Secret.
# Use this for anything sensitive (database passwords, S3 keys, etc.).
extraSecretEnv: {}

# config.json contents. Rendered verbatim into the ConfigMap.
# Only the DataStore object belongs here; every other setting lives
# in the database once the server is bootstrapped.
# See /docs/configuration/overview and /docs/ref/object/data-store.
config:
  "@type": RocksDb
  path: /var/lib/stalwart

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  ports:
    http: 8080
    https: 443
    smtp: 25
    submission: 587
    smtps: 465
    imap: 143
    imaps: 993
    sieve: 4190
  annotations: {}
  headless:
    ## @param service.headless.annotations Annotations for the headless service.
    ##
    annotations: {}

externalAccess:
  ## @param externalAccess.enabled Enable Kubernetes external cluster access to Stalwart Mail Server nodes
  ##
  enabled: true
  service:
    type: LoadBalancer
    loadBalancerClass: ""
    annotations: {}
    ports:
      smtp: 25
      submission: 587
      smtps: 465
      imap: 143
      imaps: 993
    
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 1000m
    memory: 384Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi

# -- Additional volumes
volumes: []
# -- Additional volumeMounts
volumeMounts: []

tls:
  enabled: false
  secretName: stalwart-tls

# Expose Stalwart's HTTP/management listener (service.ports.http) through an
# existing Gateway API Gateway. The Gateway itself is managed out of band.
httpRoute:
  enabled: false
  # parentRefs of the HTTPRoute: point at the Gateway to attach to.
  parentRefs:
    - name: gateway
      # namespace: default   # omit when the Gateway is in this namespace
      # sectionName: https   # optional: pin to one Gateway listener
  # Hosts this route answers for. Empty = all hostnames on the listener(s).
  hostnames: []
  # e.g. hostnames:
  #   - mail.example.com

# ---------------------------------------------------------------------------
# Optional Bulwark Webmail (JMAP webmail client for Stalwart)
# Mirrors the upstream docker-compose service. See https://bulwarkmail.org/docs
# ---------------------------------------------------------------------------
webmail:
  # Deploy the Bulwark webmail client (Deployment + Service + PVCs).
  enabled: false

  image:
    repository: ghcr.io/bulwarkmail/webmail
    pullPolicy: IfNotPresent
    # Bulwark is versioned independently of this chart; :latest is the upstream
    # compose default. Pin a tag for production.
    tag: "latest"

  # Keep at 1: Bulwark keeps state in local ReadWriteOnce PVCs.
  replicaCount: 1

  # Server listen address/port (HOSTNAME/PORT env). Use "::" for IPv6.
  hostname: "0.0.0.0"
  port: 3000

  # Extra plain-text environment variables (compose `environment`).
  extraEnv: []
  # Equivalent of compose `env_file: .env.local`. Create the Secret from your
  # local file and reference it here:
  #   kubectl create secret generic bulwark-env --from-env-file=.env.local
  #   webmail:
  #     envFrom:
  #       - secretRef:
  #           name: bulwark-env
  envFrom: []

  service:
    type: ClusterIP
    annotations: {}

  # The four compose named volumes (settings, admin, admin-state, telemetry)
  # become PVCs <release>-webmail-<dir>, each mounted at its /app/data path.
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi

  # After the first-launch setup wizard has written config.json/admin.json,
  # lock the admin config dir read-only as the compose comments suggest.
  adminReadOnly: false

  # Expose webmail through an existing Gateway API Gateway (the Gateway itself
  # is managed out of band and never created by this chart).
  httpRoute:
    enabled: false
    # parentRefs of the HTTPRoute: point at the Gateway to attach to.
    parentRefs:
      - name: gateway
        # namespace: default   # omit when the Gateway is in this namespace
        # sectionName: https   # optional: pin to one Gateway listener
    # Hosts this route answers for. Empty = all hostnames on the listener(s).
    hostnames: []
    # e.g. hostnames:
    #   - webmail.example.com

  podAnnotations: {}

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
