{{- if and .Values.webmail.enabled .Values.webmail.httpRoute.enabled -}}
{{- $fullName := printf "%s-webmail" (include "stalwart.fullname" .) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-http
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
    app.kubernetes.io/component: webmail
spec:
  parentRefs:
    {{- toYaml .Values.webmail.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.webmail.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ $fullName }}
          port: {{ .Values.webmail.port }}
      timeouts:
        request: {{ .Values.webmail.httpRoute.requestTimeout | default "1800s" }}
{{- end }}
