{{- if .Values.webmail.enabled -}}
{{- $fullName := printf "%s-webmail" (include "stalwart.fullname" .) }}
{{- $dataDirs := dict "settings" "/app/data/settings" "admin" "/app/data/admin" "admin-state" "/app/data/admin-state" "telemetry" "/app/data/telemetry" }}
{{- $jmap := .Values.webmail.jmapServerUrl }}
{{- $httpRoute := default (dict "enabled" false "hostnames" (list)) .Values.httpRoute }}
{{- if and (not $jmap) $httpRoute.enabled $httpRoute.hostnames }}
{{-   $jmap = printf "https://%s" (first $httpRoute.hostnames) }}
{{- end }}
{{- $secretName := printf "%s-session" $fullName }}
{{- $sessionSecret := .Values.webmail.sessionSecret }}
{{- if not $sessionSecret }}
{{-   $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{-   if $existing }}
{{-     $sessionSecret = index $existing.data "session-secret" | b64dec }}
{{-   end }}
{{- end }}

{{- if .Values.webmail.persistence.enabled }}
{{- range $name, $path := $dataDirs }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullName }}-{{ $name }}
  labels:
    {{- include "stalwart.labels" $ | nindent 4 }}
    app.kubernetes.io/component: webmail
spec:
  accessModes:
    - {{ $.Values.webmail.persistence.accessMode | quote }}
  {{- if $.Values.webmail.persistence.storageClass }}
  storageClassName: {{ $.Values.webmail.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $.Values.webmail.persistence.size | quote }}
---
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
    app.kubernetes.io/component: webmail
type: Opaque
data:
  # retrieve the secret data using lookup function and when not exists, return an empty dictionary / map as result
  {{- $secretObj := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict }}
  {{- $secretData := (get $secretObj "data") | default dict }}
  # set $jwtSecret to existing secret data or generate a random one when not exists
  {{- $sessionSecret := (get $secretData "jwt-secret") | default (randAlphaNum 48 | b64enc) }}
  session-secret: {{ $sessionSecret | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
    app.kubernetes.io/component: webmail
spec:
  replicas: {{ .Values.webmail.replicaCount }}
  selector:
    matchLabels:
      {{- include "stalwart.webmail.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stalwart.webmail.selectorLabels" . | nindent 8 }}
      {{- with .Values.webmail.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: webmail
          image: {{ include "stalwart.common.image" (dict "image" .Values.webmail.image "global" .Values.global "chart" nil) | quote }}
          imagePullPolicy: {{ .Values.webmail.image.pullPolicy }}
          env:
            - name: HOSTNAME
              value: {{ .Values.webmail.hostname | quote }}
            - name: PORT
              value: {{ .Values.webmail.port | quote }}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: session-secret
            {{- if $jmap }}
            - name: JMAP_SERVER_URL
              value: {{ $jmap | quote }}
            {{- end }}
            {{- with .Values.webmail.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            {{- toYaml .Values.webmail.envFrom | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          ports:
            - name: http
              containerPort: {{ .Values.webmail.port }}
          volumeMounts:
            {{- range $name, $path := $dataDirs }}
            - name: {{ $name }}
              mountPath: {{ $path }}
              {{- if and (eq $name "admin") $.Values.webmail.adminReadOnly }}
              readOnly: true
              {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.webmail.resources | nindent 12 }}
      volumes:
        {{- if .Values.webmail.persistence.enabled }}
        {{- range $name, $path := $dataDirs }}
        - name: {{ $name }}
          persistentVolumeClaim:
            claimName: {{ $fullName }}-{{ $name }}
        {{- end }}
        {{- else }}
        {{- range $name, $path := $dataDirs }}
        - name: {{ $name }}
          emptyDir: {}
        {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
    app.kubernetes.io/component: webmail
  {{- with .Values.webmail.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.webmail.service.type }}
  ports:
    - name: http
      port: {{ .Values.webmail.port }}
      targetPort: http
  selector:
    {{- include "stalwart.webmail.selectorLabels" . | nindent 4 }}
{{- end }}
